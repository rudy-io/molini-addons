# MOLINI — réseau (côté EDF). Auto-déployé par l'add-on dans /config/packages.
#
# IMPORTANT : le Linky ne mesure QUE l'échange réseau — le **soutiré** (ce qu'on
# TIRE du réseau = ce qui est payant EDF). Le solaire **autoconsommé** lui est
# invisible (il passe direct des panneaux à la maison sans traverser le compteur).
# Donc on n'expose ici que le réseau, qui est fiable et utile (la facture).
# La **consommation totale** et l'**autoconsommation** nécessitent une pince de
# mesure dédiée (ex. Meross EM06) sur l'arrivée générale — à venir.
template:
  - sensor:
      - name: "MOLINI Réseau soutiré"
        unique_id: molini_reseau_soutire
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ states('sensor.molini_puissance_soutiree') not in ['unknown','unavailable','none'] }}"
        state: "{{ [ states('sensor.molini_puissance_soutiree') | float(0), 0 ] | max | round(0) }}"

# Énergie tirée du réseau aujourd'hui (= payant EDF), remise à zéro chaque jour.
# Source = molini_soutire_total (EAST cumulatif détecté par ha_discovery).
utility_meter:
  molini_soutire_jour:
    source: sensor.molini_soutire_total
    cycle: daily
