# MOLINI — pilotage automatique du chauffe-eau (charge pilotée).
# Auto-déployé par l'add-on dans /config/packages. 100 % LOCAL : automations
# HA natives — fonctionne box hors-ligne, survit aux restarts, visible dans HA.
#
# Modes (input_select, défaut = PREMIÈRE option → « Toujours allumé ») :
#   - Toujours allumé : relais fermé en permanence (comportement contacteur
#     classique / pré-Moli). DÉFAUT — zéro changement de comportement au deploy.
#   - Auto (solaire + heures creuses) : chauffe sur SURPLUS solaire (injection
#     > seuil, hystérésis + anti-court-cycle) + GARANTIE heures creuses (eau
#     chaude le matin quoi qu'il arrive — le thermostat du ballon coupe seul).
#   - Heures creuses : uniquement la fenêtre HC (contacteur jour/nuit).
#   - Arrêt : relais ouvert (vacances).
#
# Heures creuses : détectées via la période tarifaire Linky (sensor.molini_ptec,
# rôle linky_ptec — universel, zéro config) si disponible, SINON fenêtre
# input_datetime configurable depuis le dashboard (défaut 23:00 → 07:00).
#
# Sûreté :
#   - le relais visé est UNIQUEMENT l'alias switch.molini_chauffe_eau (posé par
#     ha_provision — sortie Shelly nommée ou override explicite validé) ;
#   - garde `switch dispo` sur toutes les actions (box sans chauffe-eau =
#     automations inertes, pas d'erreurs au démarrage) ;
#   - anti-court-cycle 15 min ; jamais de coupure pendant la fenêtre HC en Auto.

input_select:
  molini_chauffe_eau_mode:
    name: "MOLINI Chauffe-eau mode"
    icon: mdi:water-boiler-auto
    options:
      - "Toujours allumé"
      - "Auto (solaire + heures creuses)"
      - "Heures creuses"
      - "Arrêt"

input_number:
  # Seuil d'ENCLENCHEMENT sur surplus : injection réseau (W) au-delà de
  # laquelle on lance la chauffe. À caler ≈ puissance du ballon (2 200 W
  # typique) pour que la chauffe reste couverte par le solaire.
  molini_ce_seuil_surplus:
    name: "MOLINI CE seuil surplus"
    min: 500
    max: 6000
    step: 100
    unit_of_measurement: "W"
    icon: mdi:solar-power-variant
  # Seuil de COUPURE : soutirage réseau (W) au-delà duquel le solaire ne
  # couvre plus la chauffe (hors fenêtre HC) → on coupe après 10 min.
  molini_ce_seuil_arret:
    name: "MOLINI CE seuil arrêt"
    min: 100
    max: 2000
    step: 50
    unit_of_measurement: "W"
    icon: mdi:transmission-tower-export

input_datetime:
  # Fenêtre HC de repli (utilisée seulement si la période tarifaire Linky
  # n'est pas disponible). À caler sur le contrat du client.
  molini_hc_debut:
    name: "MOLINI HC début"
    has_date: false
    has_time: true
  molini_hc_fin:
    name: "MOLINI HC fin"
    has_date: false
    has_time: true

template:
  - binary_sensor:
      # ── Sommes-nous en heures creuses ? ─────────────────────────────────
      # Source 1 : période tarifaire Linky (PTEC — « HC.. », « HCJB »…).
      # Source 2 (repli) : fenêtre input_datetime, gère le passage minuit.
      - name: "MOLINI Heures creuses"
        unique_id: molini_heures_creuses
        icon: mdi:clock-time-eleven-outline
        state: >
          {% set ptec = states('sensor.molini_ptec') | upper %}
          {% if ptec not in ['UNKNOWN', 'UNAVAILABLE', 'NONE', ''] %}
          {{ ptec.startswith('HC') }}
          {% else %}
          {% set n = now().hour * 60 + now().minute %}
          {% set d = states('input_datetime.molini_hc_debut') %}
          {% set f = states('input_datetime.molini_hc_fin') %}
          {% set deb = (d[0:2] | int(23)) * 60 + (d[3:5] | int(0)) %}
          {% set fin = (f[0:2] | int(7)) * 60 + (f[3:5] | int(0)) %}
          {% if deb <= fin %}
          {{ deb <= n and n < fin }}
          {% else %}
          {{ n >= deb or n < fin }}
          {% endif %}
          {% endif %}

      # ── Surplus solaire disponible ? ────────────────────────────────────
      # Injection réseau (molini_reseau négatif) au-delà du seuil configuré.
      - name: "MOLINI Surplus solaire"
        unique_id: molini_surplus_solaire
        icon: mdi:white-balance-sunny
        availability: "{{ states('sensor.molini_reseau') not in ['unknown','unavailable','none'] }}"
        state: >
          {{ (states('sensor.molini_reseau') | float(0))
             <= -(states('input_number.molini_ce_seuil_surplus') | float(2200)) }}

automation:
  # ── Garantie heures creuses : ON à l'entrée de fenêtre ──────────────────
  - id: molini_ce_hc_debut
    alias: "MOLINI CE — heures creuses : marche"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.molini_heures_creuses
        to: "on"
    conditions:
      - condition: template
        value_template: "{{ states('switch.molini_chauffe_eau') not in ['unknown','unavailable'] }}"
      - condition: state
        entity_id: input_select.molini_chauffe_eau_mode
        state:
          - "Auto (solaire + heures creuses)"
          - "Heures creuses"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.molini_chauffe_eau

  # ── Fin de fenêtre HC : OFF (sauf surplus solaire en cours en Auto) ─────
  - id: molini_ce_hc_fin
    alias: "MOLINI CE — heures creuses : arrêt"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.molini_heures_creuses
        to: "off"
    conditions:
      - condition: template
        value_template: "{{ states('switch.molini_chauffe_eau') not in ['unknown','unavailable'] }}"
      - condition: state
        entity_id: input_select.molini_chauffe_eau_mode
        state:
          - "Auto (solaire + heures creuses)"
          - "Heures creuses"
      - condition: template
        value_template: >
          {{ not (is_state('input_select.molini_chauffe_eau_mode',
                           'Auto (solaire + heures creuses)')
                  and is_state('binary_sensor.molini_surplus_solaire', 'on')) }}
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.molini_chauffe_eau

  # ── Surplus solaire : ON après 5 min de surplus confirmé ────────────────
  - id: molini_ce_surplus_debut
    alias: "MOLINI CE — surplus solaire : marche"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.molini_surplus_solaire
        to: "on"
        for: "00:05:00"
    conditions:
      - condition: template
        value_template: "{{ states('switch.molini_chauffe_eau') not in ['unknown','unavailable'] }}"
      - condition: state
        entity_id: input_select.molini_chauffe_eau_mode
        state: "Auto (solaire + heures creuses)"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.molini_chauffe_eau

  # ── Plus de solaire : OFF après 10 min de soutirage (hors fenêtre HC) ───
  - id: molini_ce_surplus_fin
    alias: "MOLINI CE — surplus terminé : arrêt"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: template
        value_template: >
          {{ (states('sensor.molini_reseau') | float(0))
             > (states('input_number.molini_ce_seuil_arret') | float(300)) }}
        for: "00:10:00"
    conditions:
      - condition: state
        entity_id: input_select.molini_chauffe_eau_mode
        state: "Auto (solaire + heures creuses)"
      - condition: state
        entity_id: binary_sensor.molini_heures_creuses
        state: "off"
      - condition: state
        entity_id: switch.molini_chauffe_eau
        state: "on"
      # anti-court-cycle : le relais ne bouge pas s'il a changé il y a < 15 min
      - condition: template
        value_template: >
          {{ (now() - states.switch.molini_chauffe_eau.last_changed).total_seconds() > 900 }}
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.molini_chauffe_eau

  # ── Application du mode (changement de mode + démarrage de HA) ──────────
  # Rend l'état du relais DÉTERMINISTE : « Toujours allumé » (défaut) ferme le
  # relais au boot — restaure le comportement contacteur d'avant l'install.
  - id: molini_ce_mode
    alias: "MOLINI CE — application du mode"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: input_select.molini_chauffe_eau_mode
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ states('switch.molini_chauffe_eau') not in ['unknown','unavailable'] }}"
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.molini_chauffe_eau_mode
                state: "Toujours allumé"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.molini_chauffe_eau
          - conditions:
              - condition: state
                entity_id: input_select.molini_chauffe_eau_mode
                state: "Arrêt"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.molini_chauffe_eau
          - conditions:
              - condition: state
                entity_id: input_select.molini_chauffe_eau_mode
                state: "Heures creuses"
            sequence:
              - if:
                  - condition: state
                    entity_id: binary_sensor.molini_heures_creuses
                    state: "on"
                then:
                  - action: switch.turn_on
                    target:
                      entity_id: switch.molini_chauffe_eau
                else:
                  - action: switch.turn_off
                    target:
                      entity_id: switch.molini_chauffe_eau
          - conditions:
              - condition: state
                entity_id: input_select.molini_chauffe_eau_mode
                state: "Auto (solaire + heures creuses)"
            sequence:
              - if:
                  - condition: or
                    conditions:
                      - condition: state
                        entity_id: binary_sensor.molini_heures_creuses
                        state: "on"
                      - condition: state
                        entity_id: binary_sensor.molini_surplus_solaire
                        state: "on"
                then:
                  - action: switch.turn_on
                    target:
                      entity_id: switch.molini_chauffe_eau
                else:
                  - action: switch.turn_off
                    target:
                      entity_id: switch.molini_chauffe_eau
