title: Réglages
path: reglages
icon: mdi:cog
theme: Moli
cards:
  - type: markdown
    content: >
      ## Réglages


      Les paramètres techniques de votre box (broker, passerelle, sauvegardes)
      sont gérés automatiquement par Moli. Cette page accueillera bientôt vos
      préférences (notifications, scénarios, accès famille).
  - type: markdown
    content: >
      Besoin d'accéder à l'interface complète de Home Assistant (appareils,
      historiques, réglages avancés) ? Utilise le bouton ci-dessous.
  - type: custom:button-card
    name: Configurer Home Assistant
    icon: mdi:cog-outline
    show_state: false
    tap_action:
      action: navigate
      navigation_path: /moli-energie/reglages?disable_km
    styles:
      card:
        - height: 64px
        - border-radius: 12px
        - border: 1px solid '#DCD8CC'
      name:
        - font-size: 14px
        - color: '#161510'
      icon:
        - width: 26px
        - color: '#8A6A14'
