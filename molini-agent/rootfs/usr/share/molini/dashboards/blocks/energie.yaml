title: Énergie
path: energie
icon: mdi:solar-power
theme: Moli
type: sections
max_columns: 1
sections:
  - type: grid
    cards:
      - type: heading
        heading: Production solaire
        heading_style: title
        icon: mdi:solar-power

      - type: grid
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.molini_solaire_production
            name: Production
            needle: true
            min: 0
            max: __PROD_MAX__
            segments:
              - from: 0
                color: "#5f5e5a"
              - from: __PROD_SEG1__
                color: "#ba7517"
              - from: __PROD_SEG2__
                color: "#1d9e75"

          # Soutiré réseau = ce qu'elle TIRE du réseau (= payant EDF). À 0 quand le
          # solaire couvre tout. La conso TOTALE (autoconso comprise) n'est PAS
          # mesurable par le Linky seul → elle arrivera avec la pince de conso.
          - type: gauge
            entity: sensor.molini_reseau_soutire
            name: Réseau (EDF)
            needle: true
            min: 0
            max: 9000
            segments:
              - from: 0
                color: "#1d9e75"
              - from: 3000
                color: "#ba7517"
              - from: 6000
                color: "#e24b4a"

      - type: markdown
        content: >
          ⚡ **Produit aujourd'hui :** {{ states('sensor.molini_solaire_production_aujourd_hui') }} kWh.


          🔌 **Tiré du réseau aujourd'hui :** {{ states('sensor.molini_soutire_jour') }} kWh —
          soit ~**{{ (states('sensor.molini_soutire_jour') | float(0) * __PRIX_KWH__) | round(2) }} €**
          payés à EDF *(tarif __PRIX_KWH_FR__ €/kWh)*.


          *Consommation totale & autoconsommation : disponibles dès l'installation de la pince de mesure.*

  - type: grid
    cards:
      - type: heading
        heading: Production par panneau
        heading_style: title

      - type: markdown
        content: MOLINI_PANELS

  - type: grid
    cards:
      - type: heading
        heading: 24 dernières heures
        heading_style: title

      - type: custom:apexcharts-card
        graph_span: 24h
        header:
          show: false
        series:
          - entity: sensor.molini_solaire_production
            name: Production
            type: area
            color: "#1d9e75"
          - entity: sensor.molini_reseau_soutire
            name: Réseau (EDF)
            type: line
            color: "#e24b4a"

  - type: grid
    cards:
      - type: heading
        heading: Réseau (côté EDF)
        heading_style: title

      - type: entities
        state_color: false
        entities:
          - entity: sensor.molini_solaire_production
            name: Production solaire
          - entity: sensor.molini_reseau_soutire
            name: Tiré du réseau (payant EDF)
          - entity: sensor.molini_soutire_jour
            name: Réseau aujourd'hui

      - type: markdown
        content: >
          ℹ️ La **consommation totale** et l'**autoconsommation** apparaîtront ici
          dès l'installation de la pince de mesure sur le tableau — le Linky ne voit
          que les échanges réseau, pas le solaire autoconsommé.

  - type: grid
    cards:
      - type: heading
        heading: Compteur électrique
        heading_style: title

      - type: entities
        state_color: false
        entities:
          - entity: sensor.molini_index_hc
            name: Index heures creuses
          - entity: sensor.molini_index_hp
            name: Index heures pleines
