title: Énergie
path: energie
icon: mdi:solar-power
cards:
  - type: heading
    heading: Production solaire
    heading_style: title
    icon: mdi:solar-power

  - type: gauge
    entity: sensor.molini_solaire_production
    name: Production en ce moment
    needle: true
    min: 0
    max: 10000
    segments:
      - from: 0
        color: "#9e9e9e"
      - from: 1500
        color: "#f5c451"
      - from: 4000
        color: "#1d9e75"

  - type: glance
    columns: 3
    show_state: true
    entities:
      - entity: sensor.molini_solaire_production
        name: Maintenant
      - entity: sensor.molini_solaire_production_aujourd_hui
        name: Aujourd'hui
      - entity: sensor.molini_solaire_production_totale
        name: Depuis l'origine

  - type: conditional
    conditions:
      - condition: state
        entity: sensor.molini_consommation_maison
        state_not: unavailable
    card:
      type: glance
      columns: 1
      entities:
        - entity: sensor.molini_consommation_maison
          name: Consommation maison

  - type: heading
    heading: Production par panneau
    heading_style: title

  - type: markdown
    content: MOLINI_PANELS

  - type: history-graph
    title: Production des dernières 24 h
    hours_to_show: 24
    entities:
      - entity: sensor.molini_solaire_production
        name: Production

  - type: entities
    title: Compteur électrique
    state_color: false
    entities:
      - entity: sensor.molini_index_hc
        name: Index heures creuses
      - entity: sensor.molini_index_hp
        name: Index heures pleines

  - type: markdown
    content: >
      ### Consommation — bientôt disponible


      Le suivi de votre consommation et des échanges avec le réseau en temps réel
      s'activera dès le passage de votre compteur Linky en **mode TIC standard**
      (un simple appel à Enedis suffit). La couleur **Tempo** du jour apparaîtra
      également ici.
